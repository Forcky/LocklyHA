enable_native_auto_lock:
  name: Enable native Auto-Detection locking
  description: >
    Enables Lockly's lock-resident Automation mode. The deadbolt remains
    retracted while the door is open and locks immediately when the lock's
    magnetic door sensor detects that the door has closed. This configures the
    lock itself; Home Assistant does not poll to implement the behavior.
    Currently supported over the MQTT device channel on verified hardware.
  fields:
    lock_id:
      name: Lock ID
      description: The Lockly lock ID (device UUID) to configure.
      required: true
      selector:
        text:

disable_native_auto_lock:
  name: Disable native Auto-Lock
  description: >
    Disables the lock's native Auto-Lock behavior. Currently supported over
    the MQTT device channel on verified hardware.
  fields:
    lock_id:
      name: Lock ID
      description: The Lockly lock ID (device UUID) to configure.
      required: true
      selector:
        text:

list_guests:
  name: List Guests
  description: >
    Retrieves the guest list for a Lockly lock and fires a lockly_guest_list
    event with the results.
  fields:
    lock_id:
      name: Lock ID
      description: The Lockly lock ID (lockId) to query.
      required: true
      example: "ABC123"
      selector:
        text:

add_guest:
  name: Add Guest
  description: >
    Adds a guest passcode to a Lockly lock and fires a lockly_guest_added
    event with the result.
  fields:
    lock_id:
      name: Lock ID
      description: The Lockly lock ID (lockId) to modify.
      required: true
      example: "ABC123"
      selector:
        text:
    name:
      name: Guest Name
      description: Display name for the guest.
      required: true
      example: "John Doe"
      selector:
        text:
    passcode:
      name: Passcode
      description: 4–8 digit numeric passcode for the guest.
      required: true
      example: "1234"
      selector:
        text:
    duration_hours:
      name: Duration (hours)
      description: >
        How many hours the passcode is valid (default 24). Ignored when
        start_time and end_time are both provided.
      required: false
      default: 24
      selector:
        number:
          min: 1
          max: 8760
          unit_of_measurement: h
    start_time:
      name: Start Time
      description: >
        UTC datetime when the passcode becomes active. Must be paired with
        end_time; overrides duration_hours.
      required: false
      example: "2026-05-15 08:00:00"
      selector:
        datetime:
    end_time:
      name: End Time
      description: >
        UTC datetime when the passcode expires. Must be paired with start_time.
      required: false
      example: "2026-05-16 08:00:00"
      selector:
        datetime:

delete_guest:
  name: Delete Guest
  description: >
    Removes a guest passcode from a Lockly lock and fires a
    lockly_guest_deleted event with the result.
  fields:
    lock_id:
      name: Lock ID
      description: The Lockly lock ID (lockId) to modify.
      required: true
      example: "ABC123"
      selector:
        text:
    user_acu_id:
      name: User ACU ID
      description: >
        The numeric userAcuId of the guest to remove (returned by list_guests
        via the lockly_guest_list event).
      required: true
      example: 42
      selector:
        number:
          min: 1
          mode: box

query_passwords:
  name: Query lock passwords
  description: >-
    Diagnostic. Reads the credential list directly from the lock and reports how
    many slots it holds and whether the host slot matches the copy the cloud
    reports. The passwords themselves are never logged or published. This wakes
    the lock, so it will beep.
  fields:
    lock_id:
      name: Lock ID
      description: The lock's device UUID (the ID field, 24 hex characters).
      required: true
      example: "300021003131471535373831"
      selector:
        text:

read_access_log:
  name: Read access log
  description: >-
    Reads the access log directly from the lock and updates the Last Access
    sensor. This is done once automatically after startup; use this to refresh
    it. It wakes the lock, so the lock will beep if its BLE sound is enabled —
    which is why it is not on a timer.
  fields:
    lock_id:
      name: Lock ID
      description: The lock's device UUID (the ID field, 24 hex characters).
      required: true
      example: "280033003131470432353835"
      selector:
        text:

read_signal:
  name: Read signal strength
  description: >
    Read radio details for a lock over the Lockly MQTT broker: the hub-to-lock
    Bluetooth signal, the hub's WiFi signal and its firmware version. Useful for
    working out why one lock times out when others on the same hub do not.
    Populates the diagnostic sensors, which are disabled by default, and fires a
    lockly_signal event. Requires a hub that is present on the MQTT channel;
    hubs that are not answer "device is offline" and no reading is available.
  fields:
    lock_id:
      name: Lock ID
      description: Device UUID of one lock. Omit to read every lock.
      required: false
      selector:
        text:

refresh_door_state:
  name: Refresh door state
  description: >
    Ask the lock for a fresh door-sensor reading and publish it to the door
    entity. This wakes the lock over Bluetooth, so the lock may chirp — call it
    when you need a current reading, not on a schedule. MQTT-only: a
    hub-relayed lock cannot answer it.
  fields:
    lock_id:
      name: Lock ID
      description: Device UUID of the lock to query.
      required: true
      selector:
        text:
